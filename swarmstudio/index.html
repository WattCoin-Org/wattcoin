      <div style="max-width:800px;margin:0 auto;padding:40px 20px;font-family:system-ui,sans-serif;color:#e0e0e0;background:#0a0a0a;">
        <h1 style="font-size:2em;margin-bottom:8px;">SwarmStudio — Multi-Model AI Debates</h1>
        <p style="font-size:1.1em;color:#999;margin-bottom:24px;">
          Put the same problem to 2-6 AI models at once and watch them challenge, refine, and
          build on each other. Round-robin reasoning with per-model cost tracking and a referee
          verdict. Free to use — you bring your own API keys.
        </p>

        <h2 style="font-size:1.3em;margin-top:32px;">How it works</h2>
        <ul style="color:#bbb;line-height:2;">
          <li>Choose 2-6 models — Claude, GPT, Gemini, Grok, or any provider you hold a key for.</li>
          <li>Pose one problem. Each model answers, then reads the others and responds.</li>
          <li>Rounds continue until positions converge or the disagreement is clear.</li>
          <li>A referee model summarises where they agreed, where they split, and why.</li>
          <li>Token spend is tracked per model, so you can see what each opinion cost.</li>
        </ul>

        <h2 style="font-size:1.3em;margin-top:32px;">Why run several models</h2>
        <p style="color:#bbb;line-height:1.8;">
          One model's answer carries that model's blind spots. Several models arguing surfaces the
          parts of a problem where reasonable approaches genuinely differ — usually the part worth
          your attention. Agreement between independently trained models is weak evidence of a
          right answer; disagreement is a reliable marker of a hard question.
        </p>

        <h2 style="font-size:1.3em;margin-top:32px;">Bring your own keys</h2>
        <p style="color:#bbb;line-height:1.8;">
          SwarmStudio is free. You supply provider API keys and pay those providers directly, at
          cost. No markup, no subscription.
        </p>
